  --font:"MS Sans Serif","Microsoft Sans Serif",Tahoma,"DejaVu Sans",sans-serif; --mono:"Fixedsys","Lucida Console","DejaVu Sans Mono",monospace;

  --hdr:linear-gradient(180deg,#f7f9fc,#c6ced8 45%,#8c96a3 50%,#dfe5ec 85%,#aab3bf); --nav:linear-gradient(90deg,#141a28,#0c111c); --main:transparent;
  --panel:linear-gradient(180deg,rgba(32,40,58,.92),rgba(14,18,28,.94)); --panel2:#1a2130; --line:#2c3548; --line2:#4a5670;

  --eye-s1:#f4f7fb; --eye-s2:#8f99a8; --eye-i1:#ffffff; --eye-i2:#8ab4ff; --eye-i3:#2a2f63; --eye-line:#ffffff;

/* =====================================================================
   BASE LAYOUT
   ===================================================================== */
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bgimg),var(--bg);background-attachment:fixed;color:var(--text);font:14px/1.45 var(--font);display:grid;grid-template-columns:232px 1fr;grid-template-rows:58px 1fr;height:100vh;overflow:hidden}
#fx{position:fixed;inset:0;z-index:-1;pointer-events:none}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px;border:2px solid transparent;background-clip:padding-box}
button,select{font:inherit;color:inherit;cursor:pointer}
a{color:var(--acc)}

header{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid var(--line);background:var(--hdr);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);position:relative;z-index:2}
.logo{font:700 18px var(--mono);letter-spacing:.18em;display:flex;align-items:center;gap:10px;white-space:nowrap}
.logo i{width:24px;height:24px;border:2px solid var(--acc);transform:rotate(45deg);display:grid;place-items:center;box-shadow:0 0 14px var(--orb-glow)}
.logo i::after{content:"";width:8px;height:8px;background:var(--acc2)}
.logo b{color:var(--acc)}
.logo small{font:500 10px var(--mono);letter-spacing:.1em;color:var(--faint);margin-left:4px}
.hmeter{margin-left:auto;display:flex;gap:12px;align-items:center;font:12px var(--mono);color:var(--dim)}
.hmeter .bar{width:110px}
.hbtn{background:var(--btn);border:1px solid var(--btnb);color:var(--btnt);border-radius:var(--rsm);padding:6px 12px;font-size:12.5px}
.hbtn:hover{border-color:var(--acc)}
.themepick{background:var(--btn);border:1px solid var(--btnb);color:var(--btnt);border-radius:var(--rsm);padding:6px 10px;font-size:12.5px}
.themepick option{color:#000;background:#fff}

nav{border-right:1px solid var(--line);padding:12px 10px;overflow:auto;background:var(--nav);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
nav .grp{font:11px var(--mono);color:var(--faint);letter-spacing:.14em;text-transform:uppercase;margin:14px 10px 6px}
nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:0;border-radius:var(--rsm);padding:9px 11px;color:var(--dim)}
nav button svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button:hover{background:var(--rowhover);color:var(--text)}
nav button.on{background:var(--navon);color:var(--acc);box-shadow:inset 2px 0 0 var(--acc)}

main{overflow:auto;padding:26px 30px 120px;background:var(--main)}
h1{font-size:24px;font-weight:600;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--dim);margin:0 0 22px;max-width:780px}
h2{font:600 13px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:28px 0 10px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.two{grid-template-columns:1fr 1fr;align-items:start}
@media (max-width:1100px){.two{grid-template-columns:1fr}}
.stat .k{font:11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.stat .v{font:600 24px var(--mono);margin:6px 0 8px}
.stat .s{color:var(--dim);font-size:12.5px}

.bar{height:6px;background:var(--track);border-radius:4px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--fill);border-radius:4px;transition:width .5s}
.bar.hot>span{background:linear-gradient(90deg,#d17a00,var(--warn))}
.bar.red>span{background:linear-gradient(90deg,#b0193f,var(--bad))}

.btn{display:inline-flex;align-items:center;gap:8px;background:var(--btn);border:1px solid var(--btnb);color:var(--btnt);border-radius:var(--rsm);padding:8px 14px;font-weight:550}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--pri);border-color:transparent;color:var(--prit)}
.btn.pri:hover{filter:brightness(1.1)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 11px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* hero + orb + eye */
.hero{display:flex;gap:30px;align-items:center;padding:26px}
.orb{position:relative;width:156px;height:156px;flex:none;border-radius:50%;border:0;background:var(--orb-ring);padding:4px;box-shadow:0 0 34px var(--orb-glow);transition:box-shadow .3s,transform .15s}
.orb:hover{box-shadow:0 0 52px var(--orb-glow)}
.orb:active{transform:scale(.97)}
.orb .in{position:relative;display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--orb-bg);overflow:hidden}
.orb .eye{width:118%;height:118%;margin-top:-6%}
.orb .lbl{position:absolute;bottom:16px;left:0;right:0;font:700 10px var(--mono);letter-spacing:.22em;color:var(--acc);text-align:center;pointer-events:none}
.orb.scanning{animation:orbpulse 1.6s ease-in-out infinite}
.orb.scanning .ringspin{animation:spin 2.4s linear infinite}
@keyframes orbpulse{50%{box-shadow:0 0 70px var(--orb-glow)}}
@keyframes spin{to{transform:rotate(360deg)}}
.eye .sclera{fill:url(#scleraG)}
.eye .iris{fill:url(#irisG)}
.eye .iris-ring{fill:none;stroke:var(--eye-i3);stroke-width:1.6}
.eye .iris-fx{stroke:var(--eye-line);stroke-width:.45;opacity:.55;fill:none}
.eye .pupil{fill:var(--eye-pupil);transition:r .35s ease}
.eye .glint{fill:var(--eye-glint);opacity:.85}
.eye .lid{fill:none;stroke:var(--eye-lid);stroke-width:2.6;stroke-linejoin:round}
.eye .geo{opacity:0;transition:opacity .4s;stroke:var(--eye-geo);stroke-width:.7;fill:none;filter:drop-shadow(0 0 1.2px var(--eye-geo));transform-box:fill-box;transform-origin:center}
.eye .geo .g{opacity:0;transition:opacity .35s}
.eye .geo .g.on{opacity:1}
.eye .geo .dot{fill:var(--eye-geo);stroke:none}
.scanning .eye .pupil{r:14.6}
.scanning .eye .glint{opacity:.35}
.scanning .eye .geo{opacity:1;animation:spin 9s linear infinite}
.scanning .eye .iris-fx{animation:spin 4s linear infinite reverse;transform-box:fill-box;transform-origin:center}
.scanning .eye .iris{filter:brightness(1.25)}

table{width:100%;border-collapse:collapse}
th{font:11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--row);vertical-align:top}
tr:hover td{background:var(--rowhover)}
td .n{font-weight:600}
.m{color:var(--dim);font-size:12.5px;word-break:break-word}
.mono{font-family:var(--mono);font-size:12.5px}
.tbl{padding:0;overflow:hidden}

.tag{display:inline-block;font:600 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;border-radius:5px;padding:2px 7px;border:1px solid;white-space:nowrap}
.t-keep,.t-low,.t-ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.t-optional,.t-medium,.t-info{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.t-disable,.t-high,.t-bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.t-dim{color:var(--dim);border-color:var(--line2);background:transparent}

.sw{position:relative;display:inline-block;width:40px;height:22px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:var(--track);border:1px solid var(--line2);border-radius:22px;transition:.2s}
.sw span::before{content:"";position:absolute;width:16px;height:16px;left:2px;top:2px;background:var(--dim);border-radius:50%;transition:.2s}
.sw input:checked+span{background:var(--sw-on)}
.sw input:checked+span::before{transform:translateX(18px);background:var(--acc);box-shadow:0 0 8px var(--orb-glow)}
input[type=checkbox].ck{width:16px;height:16px;accent-color:var(--acc)}

.tog{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--row)}
.tog:last-child{border:0}
.tog .t{font-weight:600}.tog .d{color:var(--dim);font-size:12.5px}

.seg{display:inline-flex;border:1px solid var(--btnb);border-radius:var(--rsm);overflow:hidden;background:var(--btn)}
.seg button{background:none;border:0;padding:6px 12px;color:var(--btnt);font-size:12.5px;opacity:.7}
.seg button.on{background:var(--navon);opacity:1;color:var(--acc)}

.empty{padding:34px;text-align:center;color:var(--dim)}
.load{display:flex;gap:12px;align-items:center;color:var(--dim);padding:30px}
.load::before{content:"";width:18px;height:18px;border:2px solid var(--line2);border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite}
.note{border-left:2px solid var(--acc2);background:color-mix(in srgb,var(--acc2) 10%,transparent);padding:12px 14px;border-radius:0 10px 10px 0;font-size:13px}
.note.warn{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent)}

<body>
<canvas id="fx"></canvas>
<header>
  <div class="logo"><i></i>TWEAK<b>R23</b><small>by Tech Merlin</small></div>
  <div class="hmeter"><span>RAM</span><div class="bar" id="hram"><span style="width:0"></span></div><span id="hramt">--</span></div>
  <select class="themepick" id="themepick" title="Theme">
    <option value="cyber">Cyber</option><option value="aero">Aero</option><option value="glass">Liquid Glass</option>
    <option value="rain">Green Rain</option><option value="retro">Retro 95</option><option value="chrome">Liquid Metal</option>
  </select>
  <button class="hbtn" id="snapbtn" onclick="sysAct('restorepoint',this)">◆ Restore point</button>
  <button class="hbtn" onclick="quit()">Quit</button>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<div id="log"><button class="x" onclick="logBox.classList.remove('show')">✕</button></div>

<script>
/* =====================================================================
   PLATFORM
   ===================================================================== */
const TOKEN = '__TOKEN__';
const PLATFORM = '__PLATFORM__';
const WIN = PLATFORM !== 'linux';
const OSNAME = WIN ? 'Windows' : 'Linux';

const TXT = WIN ? {
  snap: '◆ Restore point', snapTip: 'Snapshot Windows so you can roll back any change',
  quick: 'Deletes temp files, update leftovers, crash dumps and browser caches (closed browsers only), flushes DNS, and counts broken shortcuts and startup apps worth turning off. Nothing personal is deleted.',
  startup: 'Everything that launches when you sign in, including the scheduled tasks updaters like to hide in. Switching one off only stops it auto-starting — the app still works when you open it, and you can switch it back on any time.',
  turbo: 'Close background apps to free memory right now — handy before editing, rendering or gaming. Windows itself is never touched. Apps with an open window are asked to close politely, so you still get any "save changes?" prompt.',
  shortcuts: 'Finds shortcuts on your desktop, Start menu and taskbar that point at apps or files that no longer exist. Removed shortcuts go to the Recycle Bin, so nothing is lost if one was only pointing at an unplugged drive.',

  wuCheck: 'Check for driver updates', wuDesc: 'Asks Windows Update for driver updates available for this PC. Takes up to a minute.', wuOpen: 'Open Optional updates', wuNone: 'Windows Update has no newer drivers for this PC.', wuHint: 'Install them from <b>Open Optional updates</b>.',
  drvCols: ['Device', 'Provider', 'Version', 'Date'],
  drvNote: "Age alone doesn't mean a driver is bad — chipset and USB drivers often stay unchanged for years. Use the Windows Update check above, or your PC maker's support page, to see if a newer one exists.",
  crash: 'unexpected shutdowns', bsod: 'blue screens', bsodShort: 'BSOD',
  disk: "Checks each drive's file system for errors while Windows keeps running (the modern version of chkdsk). If it finds problems you can repair them on the spot, or at the next restart for the system drive.",
  diskBtns: [['scan', 'Scan'], ['spotfix', 'Fix now'], ['offline', 'Fix at restart']],
  offlineConfirm: n => `Schedule a full repair of ${n} at the next restart? Windows will take a few extra minutes to start.`,
  power: [['power-balanced', 'Balanced'], ['power-high', 'High performance'], ['power-ultimate', 'Ultimate']],
  powerNote: 'Balanced is right for laptops on battery. High performance or Ultimate keep the CPU ready for rendering, editing and games on desktops.',
  skipCard: ['Registry defrag / cleaning', 'Left out on purpose. Windows already compacts its registry on its own, and "cleaning" it gives no measurable speed-up while being the #1 way optimizer apps break PCs.'],
  sysSub: "Maintenance tools, the power plan, and a handful of tweaks that fix everyday Windows annoyances. Make a restore point first if you're about to change a lot.",
  privacySettings: 'Privacy settings'
} : {
  snap: '◆ Snapshot', snapTip: 'Create a Timeshift system snapshot',
  quick: 'Clears old cache and temp files, the apt package cache, old snap versions and logs older than a week, flushes DNS, and counts broken launchers and autostart apps worth turning off. Nothing personal is deleted.',
  startup: 'Apps in Startup Applications, your own user services, and a few optional system services (printing, modem, crash reporting). Turning one off only stops it auto-starting — it still runs when you open it.',
  turbo: 'Quit background apps to free memory right now — handy before editing, rendering or gaming. Your desktop session is never touched. Apps get a normal quit signal first, the same as closing them.',
  shortcuts: 'Finds app launchers (.desktop files) in your menu and on the desktop whose program no longer exists, plus broken links on the desktop. Removed items go to the Trash.',
  drivers: 'Shows which kernel driver each device uses and which have none, then asks Ubuntu for recommended proprietary drivers and fwupd for firmware updates.',
  wuCheck: 'Check drivers & firmware', wuDesc: 'Runs ubuntu-drivers and fwupd to list recommended drivers and firmware updates.', wuOpen: 'Additional Drivers', wuNone: 'No recommended drivers or firmware updates found.', wuHint: 'Install drivers from <b>Additional Drivers</b>, firmware from GNOME Software or <span class="mono">fwupdmgr update</span>.',
  drvCols: ['Device', 'Driver in use', 'Modules', 'Bus'],
  drvNote: 'Most Linux drivers ship inside the kernel and update with it. Devices marked "no driver" may simply not need one (some bridges and sensors), or may need a proprietary driver from Additional Drivers.',
  crash: 'kernel errors', bsod: 'kernel oopses', bsodShort: 'oops',
  disk: 'Checks file system state and drive SMART health. ext4 drives can be checked at the next boot; btrfs drives can be scrubbed while mounted.',
  diskBtns: [['scan', 'Scan'], ['spotfix', 'Repair (btrfs scrub)'], ['offline', 'Check at boot']],
  offlineConfirm: n => `Check ${n} at the next boot? Startup will take a little longer once.`,
  power: [['power-saver', 'Power saver'], ['power-balanced', 'Balanced'], ['power-high', 'Performance']],
  powerNote: 'Uses power-profiles-daemon. Performance keeps the CPU clocked up for rendering and games; Power saver stretches battery.',
  skipCard: ['Registry / defrag', "Not a thing here. Linux has no registry, and ext4/btrfs don't need defragmenting. SSDs are kept fast by TRIM, which is under Optimize drives."],
  sysSub: "Maintenance tools, the power profile, and tweaks that fix everyday desktop annoyances. Take a snapshot first if you're about to change a lot.",
  privacySettings: 'Privacy settings (GNOME)'
};

const SWEEP = WIN ? [
  ['recent', 'Recent files list', 'The "Recent" list in Explorer and Start.', true],
  ['runmru', 'Run dialog history', 'Commands typed into Win+R.', true],
  ['typed', 'Explorer address bar history', 'Paths typed into File Explorer.', true],
  ['search', 'Explorer search history', 'Past searches in File Explorer.', true],
  ['clipboard', 'Clipboard', 'Whatever is currently copied.', true],
  ['dns', 'DNS cache', 'The list of websites your PC looked up recently.', true],
  ['jumplists', 'Jump lists', 'Recent items in taskbar right-click menus. Also clears items you pinned there.', false],
  ['history', 'Browser history (Chrome, Edge, Brave…)', 'Closed browsers only. Bookmarks and passwords are kept.', false],
  ['cookies', 'Browser cookies', 'Signs you out of every website. Closed browsers only.', false]
] : [
  ['recent', 'Recent files list', 'The "Recent" list in Files and app open dialogs.', true],
  ['clipboard', 'Clipboard', 'Whatever is currently copied.', true],
  ['dns', 'DNS cache', 'Websites your PC looked up recently (systemd-resolved).', true],
  ['shellhist', 'Terminal history', 'Your bash history file. Open terminals may write theirs back on exit.', false],
  ['history', 'Browser history (Chrome, Chromium, Brave…)', 'Closed browsers only. Bookmarks and passwords are kept.', false],
  ['cookies', 'Browser cookies', 'Signs you out of every website. Closed browsers only.', false]
];

const ACTIONS = WIN ? [
  ['restorepoint', 'Create restore point', 'A snapshot of Windows settings so any change here can be rolled back.', 'pri'],
  ['openrestore', 'Open System Restore', 'Roll Windows back to an earlier restore point.'],
  ['optimize', 'Optimize drives', 'TRIM for SSDs, defragment for hard drives. Runs in its own window.'],
  ['repair', 'Repair system files', 'DISM + SFC: finds and replaces damaged Windows files. 10–30 min.'],
  ['winsxs', 'Clean component store', 'Removes old versions of Windows components left by updates.'],
  ['explorer', 'Restart Explorer', 'Fixes a frozen taskbar, Start menu or desktop without rebooting.'],
  ['iconcache', 'Rebuild icon cache', 'Fixes blank, wrong or generic-looking icons.'],
  ['dns', 'Flush DNS', 'Fixes "site can\'t be reached" after a site moved servers.'],
  ['netreset', 'Reset network stack', 'Last resort for broken internet. Needs a restart; VPN apps may need reinstalling.', 'danger'],
  ['cleanmgr', 'Windows Disk Cleanup', "Microsoft's own cleaner, including old Windows installs."],
  ['regbackup', 'Back up registry', 'Saves a copy of your user registry to Documents\\Tweakr23 backups.']
] : [
  ['restorepoint', 'Create snapshot', 'A Timeshift snapshot of the system so you can roll back. Needs Timeshift.', 'pri'],
  ['openrestore', 'Open Timeshift', 'Browse and restore earlier snapshots.'],
  ['repair', 'Update & repair packages', 'Finishes broken installs, then runs a full apt upgrade in a terminal.'],
  ['autoremove', 'Remove unused packages', 'apt autoremove: old kernels and libraries nothing needs any more.'],
  ['flatpak', 'Remove unused Flatpak runtimes', 'Frees space left by uninstalled Flatpak apps.'],
  ['optimize', 'Optimize drives (TRIM)', 'Tells SSDs which blocks are free so they stay fast.'],
  ['drivers-install', 'Install recommended drivers', 'Runs ubuntu-drivers install in a terminal (NVIDIA, Wi-Fi etc.).'],
  ['explorer', 'Restart Files', 'Quits a stuck Files (Nautilus) window so it opens fresh.'],
  ['iconcache', 'Refresh app menu & icons', 'Fixes missing or stale entries in the app grid.'],
  ['dns', 'Flush DNS', 'Fixes "site can\'t be reached" after a site moved servers.'],
  ['netreset', 'Restart networking', 'Restarts NetworkManager. Briefly drops your connection.', 'danger'],
  ['cleanmgr', 'Disk Usage Analyzer', 'See what is filling your drive, folder by folder.'],
  ['regbackup', 'Back up desktop settings', 'Saves all GNOME/dconf settings to Documents/Tweakr23 backups.']
];

/* =====================================================================
   HELPERS
   ===================================================================== */
const $ = s => document.querySelector(s);
const main = $('#main'), logBox = $('#log');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const size = b => { b = +b || 0; const u = ['B', 'KB', 'MB', 'GB', 'TB']; let i = 0; while (b >= 1024 && i < 4) { b /= 1024; i++ } return (i ? b.toFixed(i > 2 ? 2 : 1) : b) + ' ' + u[i]; };
const arr = x => x == null ? [] : Array.isArray(x) ? x : [x];
async function api(path, body) {
  const r = await fetch(path, { method: body ? 'POST' : 'GET', headers: { 'X-Token': TOKEN, 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  let j; try { j = await r.json(); } catch { throw new Error('Engine did not answer (is the Tweakr23 terminal window still open?)'); }
  if (!r.ok || (j && j.error)) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}
function log(msg, cls = '') { const d = document.createElement('div'); d.className = cls; d.textContent = '› ' + msg; logBox.appendChild(d); logBox.classList.add('show'); logBox.scrollTop = 1e9; }
async function run(btn, fn) {
  const old = btn && btn.innerHTML; if (btn) { btn.disabled = true; btn.innerHTML = 'Working…'; }
  try { return await fn(); } catch (e) { log(e.message, 'err'); } finally { if (btn) { btn.disabled = false; btn.innerHTML = old; } }
}
const loading = t => `<div class="load">${esc(t)}</div>`;
const tag = (t, c) => `<span class="tag t-${c}">${esc(t)}</span>`;
const sw = (on, attrs) => `<label class="sw"><input type="checkbox" ${on ? 'checked' : ''} ${attrs}><span></span></label>`;
const card = (title, inner, cls = '') => `<div class="card ${cls}" data-title="${esc(title)}">${inner}</div>`;

/* =====================================================================
   THEMES
   ===================================================================== */
const THEMES = ['cyber', 'aero', 'glass', 'rain', 'retro', 'chrome'];
const picker = $('#themepick');
function setTheme(t) {
  if (!THEMES.includes(t)) t = 'cyber';
  document.documentElement.dataset.theme = t; picker.value = t;
  try { localStorage.setItem('tweakr23-theme', t); } catch {}
  startFx(t);
}
picker.onchange = () => setTheme(picker.value);

/* Background effects: digital rain for Green Rain, drifting mercury for Liquid Metal */
const fx = $('#fx'), fctx = fx.getContext('2d');
let fxMode = '', fxDrops = [], fxBlobs = [], fxLast = 0;
function sizeFx() { fx.width = innerWidth; fx.height = innerHeight; fxDrops = Array.from({ length: Math.ceil(innerWidth / 16) }, () => Math.random() * -60); }
addEventListener('resize', sizeFx);
function startFx(t) {
  fxMode = t === 'rain' ? 'rain' : t === 'chrome' ? 'chrome' : '';
  sizeFx(); fctx.clearRect(0, 0, fx.width, fx.height);
  fxBlobs = Array.from({ length: 6 }, (_, i) => ({ x: Math.random(), y: Math.random(), r: .12 + Math.random() * .14, a: Math.random() * 6.28, s: .0006 + Math.random() * .0008, h: i }));
}
const GLYPHS = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄ0123456789ABCDEF∆◇○⊕☉☽♁♃♄';
function fxTick(t) {
  requestAnimationFrame(fxTick);
  if (!fxMode || t - fxLast < 50) return; fxLast = t;
  if (fxMode === 'rain') {
    fctx.fillStyle = 'rgba(0,0,0,.09)'; fctx.fillRect(0, 0, fx.width, fx.height);
    fctx.font = '15px monospace';
    fxDrops.forEach((y, i) => {
      const ch = GLYPHS[Math.random() * GLYPHS.length | 0];
      fctx.fillStyle = Math.random() > .975 ? '#d9ffe1' : 'rgba(57,255,106,.55)';
      fctx.fillText(ch, i * 16, y * 16);
      fxDrops[i] = (y * 16 > fx.height && Math.random() > .975) ? 0 : y + 1;
    });
  } else {
    fctx.clearRect(0, 0, fx.width, fx.height);
    const W = fx.width, H = fx.height, m = Math.min(W, H);
    fxBlobs.forEach(b => {
      b.a += b.s * 50;
      const x = (b.x + Math.sin(b.a) * .08) * W, y = (b.y + Math.cos(b.a * .8) * .08) * H, r = b.r * m;
      const g = fctx.createRadialGradient(x - r * .35, y - r * .4, r * .05, x, y, r);
      g.addColorStop(0, 'rgba(255,255,255,.55)'); g.addColorStop(.35, b.h % 2 ? 'rgba(150,180,255,.35)' : 'rgba(200,170,255,.3)');
      g.addColorStop(.7, 'rgba(70,80,110,.25)'); g.addColorStop(1, 'rgba(10,14,25,0)');
      fctx.fillStyle = g; fctx.beginPath(); fctx.arc(x, y, r, 0, 6.29); fctx.fill();
    });
  }
}
requestAnimationFrame(fxTick);

/* =====================================================================
   THE EYE
   ===================================================================== */
const f = n => (+n).toFixed(2);
const pol = (r, deg) => [r * Math.cos(deg * Math.PI / 180), r * Math.sin(deg * Math.PI / 180)];
const C = (x, y, r) => `<circle cx="${f(x)}" cy="${f(y)}" r="${f(r)}"/>`;
const L = (a, b) => `<line x1="${f(a[0])}" y1="${f(a[1])}" x2="${f(b[0])}" y2="${f(b[1])}"/>`;
const PG = pts => `<polygon points="${pts.map(p => f(p[0]) + ',' + f(p[1])).join(' ')}"/>`;
const tri = (r, rot) => PG([0, 120, 240].map(a => pol(r, a + rot)));

function sacredGeometry() {
  const S = {};
  // Seed of Life
  { let s = C(0, 0, 4.6); for (let k = 0; k < 6; k++) { const p = pol(4.6, k * 60 - 90); s += C(p[0], p[1], 4.6); } S.seed = s + C(0, 0, 9.2); }
  // Flower of Life
  { const r = 3; let s = C(0, 0, r);
    for (let k = 0; k < 6; k++) { const a = pol(r, k * 60), b = pol(2 * r, k * 60), c = pol(r * Math.sqrt(3), k * 60 + 30); s += C(a[0], a[1], r) + C(b[0], b[1], r) + C(c[0], c[1], r); }
    S.flower = s + C(0, 0, 9) + C(0, 0, 9.6); }
  // Metatron's Cube
  { const d = 5.6, pts = [[0, 0]]; for (let k = 0; k < 6; k++) pts.push(pol(d, k * 60 - 90)); for (let k = 0; k < 6; k++) pts.push(pol(2 * d, k * 60 - 90));
    let s = ''; for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) s += L(pts[i], pts[j]);
    pts.forEach(p => s += C(p[0], p[1], 1.6)); S.metatron = s; }
  // Sri Yantra (simplified nine interlocking triangles)
  { const T = (ay, by, up) => { const w = Math.abs(by - ay) * .66; return PG([[0, ay], [w, by], [-w, by]]); };
    let s = C(0, 0, 12.4) + C(0, 0, 13.4);
    [[-11.2, 6.4], [-8, 8.6], [-5.2, 4.2], [-2.6, 2.6]].forEach(([a, b]) => s += T(a, b));
    [[11.2, -6.4], [8.6, -8.4], [6, -3.8], [3.8, -5.2], [1.4, -2]].forEach(([a, b]) => s += T(a, b));
    S.sri = s + '<circle class="dot" r=".9"/>'; }
  // Merkaba / star tetrahedron
  { const R = 12; let s = tri(R, -90) + tri(R, 90) + tri(R * .5, 90) + tri(R * .5, -90);
    for (let k = 0; k < 3; k++) s += L(pol(R, -90 + k * 120), pol(R, 90 + k * 120));
    S.merkaba = s + C(0, 0, 12.8); }
  // Vesica Piscis
  S.vesica = C(-3.9, 0, 7.8) + C(3.9, 0, 7.8) + L([0, -6.8], [0, 6.8]) + L([-11.7, 0], [11.7, 0]) + C(0, 0, 12.6);
  // Tree of Life: 10 sephiroth, 22 paths
  { const P = { K: [0, -12.6], Ch: [5.4, -9.4], B: [-5.4, -9.4], Cs: [5.4, -3], G: [-5.4, -3], T: [0, 0.2], N: [5.4, 3.4], H: [-5.4, 3.4], Y: [0, 7.2], M: [0, 12.6] };
    const paths = 'K-Ch K-B K-T Ch-B Ch-T Ch-Cs B-T B-G Cs-G Cs-T Cs-N G-T G-H T-N T-Y T-H N-H N-Y N-M H-Y H-M Y-M'.split(' ');
    let s = paths.map(p => { const [a, b] = p.split('-'); return L(P[a], P[b]); }).join('');
    Object.values(P).forEach(p => s += C(p[0], p[1], 1.8)); S.tree = s; }
  return S;
}

const eye = { x: 0, y: 0, mx: innerWidth / 2, my: innerHeight / 2, lastMove: 0, scanning: false, blinkT: 0, wander: [0, 0] };
addEventListener('mousemove', e => { eye.mx = e.clientX; eye.my = e.clientY; eye.lastMove = performance.now(); });
function eyeTick(now) {
  requestAnimationFrame(eyeTick);
  const look = document.getElementById('eyeLook'); if (!look) return;
  const r = look.ownerSVGElement.getBoundingClientRect();
  let tx = 0, ty = 0;
  if (eye.scanning) { tx = Math.sin(now / 700) * 3; ty = Math.cos(now / 900) * 2; }
  else if (now - eye.lastMove > 6000) {           // idle: little saccades
    if (Math.random() < .01) eye.wander = [(Math.random() - .5) * 18, (Math.random() - .5) * 10];
    [tx, ty] = eye.wander;
  } else {
    const dx = eye.mx - (r.left + r.width / 2), dy = eye.my - (r.top + r.height / 2), d = Math.hypot(dx, dy) || 1, m = Math.min(d / 10, 14);
    tx = dx / d * m; ty = dy / d * m * .72;
  }
  eye.x += (tx - eye.x) * .16; eye.y += (ty - eye.y) * .16;
  look.setAttribute('transform', `translate(${f(eye.x)} ${f(eye.y)})`);
}
requestAnimationFrame(eyeTick);
function blink(twice) {
  const a = document.getElementById('lidShape'), b = document.getElementById('lidLine'); if (!a) return;
  const t0 = performance.now(), dur = 190;
  (function step(t) {
    const p = Math.min((t - t0) / dur, 1), s = Math.max(.04, Math.abs(1 - 2 * p));
    const tr = `scale(1 ${f(s)})`; a.setAttribute('transform', tr); b.setAttribute('transform', tr);
    if (p < 1) requestAnimationFrame(step); else if (twice) setTimeout(() => blink(false), 120);
  })(t0);
}
(function blinkLoop() { setTimeout(() => { blink(Math.random() < .2); blinkLoop(); }, 2500 + Math.random() * 4000); })();
let geoTimer = null;
function setScanning(on) {
  eye.scanning = on;
  const orb = $('#qf'); if (orb) orb.classList.toggle('scanning', on);
  clearInterval(geoTimer);

    let i = 0;
    geoTimer = setInterval(() => {
      const gs = document.querySelectorAll('.eye .geo .g'); if (!gs.length) return;
      i = (i + 1) % gs.length; gs.forEach((g, k) => g.classList.toggle('on', k === i));

}

async function sweep(btn) {

async function flip(id, el) {

/* extensions */
let EX = [];
VIEWS.ext = async () => {
  main.innerHTML = `<h1>Browser Extensions</h1><p class="sub">Every extension in Chrome, Edge, Brave, Vivaldi, Opera${WIN ? '' : ', Chromium'} and Firefox, with a risk score based on what it's allowed to touch. "Remove…" opens the browser's own extension page (the clean way). "Force remove" deletes it from disk — use it for stubborn ones, especially anything marked <b>Forced by policy</b>, which is how adware locks itself in.</p>
  <div id="extw">${loading('Reading browser profiles…')}</div>`;
  try {
    const g = arr((await api('/api/extensions')).groups); EX = [];
    if (!g.length) return $('#extw').innerHTML = card('Extensions', '<div class="empty">No supported browsers found.</div>');
    const rank = { high: 0, medium: 1, low: 2 };
    $('#extw').innerHTML = g.map(b => {
      const items = arr(b.items).sort((a, c) => rank[a.risk] - rank[c.risk]);
      return `<h2>${esc(b.browser)} <span style="color:var(--faint)">· ${items.length}</span> ${b.running ? tag('open — close it to force remove', 'optional') : ''}</h2>
      ${card(b.browser, items.length ? `<table>${items.map(x => { const i = EX.push({ ...x, browser: b.browser }) - 1; return `
        <tr><td><div class="n">${esc(x.name || x.id)} <span class="m">v${esc(x.version)}</span></div>
        <div class="m">${x.perms ? 'Can access: ' + esc(x.perms) : 'Minimal permissions'}${x.profile && x.profile !== 'Default' ? ' · profile ' + esc(x.profile) : ''}</div></td>
        <td style="width:250px">${tag(x.risk + ' risk', x.risk)} ${x.policy ? tag('Forced by policy', 'bad') : ''} ${x.sideloaded ? tag('Not from store', 'optional') : ''} ${x.active === false ? tag('disabled', 'dim') : ''}</td>
        <td style="width:220px;text-align:right"><button class="btn sm" onclick="extOpen(${i})">Remove…</button> <button class="btn sm danger" onclick="extKill(${i},this)" ${b.running ? 'disabled' : ''}>Force remove</button></td></tr>`; }).join('')}</table>` : '<div class="empty">No extensions.</div>', 'tbl')}`;
    }).join('');
  } catch (e) { $('#extw').innerHTML = `<div class="note warn">${esc(e.message)}</div>`; }
};
async function extOpen(i) { try { await api('/api/extensions/open', { browser: EX[i].browser, id: EX[i].id }); log(`Opened ${EX[i].browser}'s extension page`, 'ok'); } catch (e) { log(e.message, 'err'); } }
async function extKill(i, btn) {
  const x = EX[i]; if (!confirm(`Force remove "${x.name}" from ${x.browser}?`)) return;
  await run(btn, async () => { const r = await api('/api/extensions/remove', x); log(r.message, 'ok'); VIEWS.ext(); });
}

    <div class="note" style="margin-top:12px">${WIN ? "Browser and app hardware acceleration are separate switches inside each app (e.g. Chrome Settings › System). Keep those on unless an app glitches." : 'GPU acceleration on Linux comes from the driver itself (Mesa or NVIDIA). If videos stutter, install the recommended driver above; in browsers check <span class="mono">chrome://gpu</span> or <span class="mono">about:support</span>.'}</div>`);
}

/* health */

    <div class="grid g4">

      ${card('Memory', `<div class="stat"><div class="k">Memory</div><div class="v">${size(h.mem.total)}</div><div class="bar"><span style="width:${memPct}%"></span></div><div class="s" style="margin-top:8px">${mods.length ? mods.map(m => `${size(m.size)}${m.speed ? ' @ ' + m.speed + ' MT/s' : ''}`).join(' + ') : (Math.round(memPct) + '% in use')}</div></div>`)}
      ${card('Graphics', `<div class="stat"><div class="k">Graphics</div><div class="v" style="font-size:15px">${arr(h.gpus).map(esc).join('<br>') || '–'}</div></div>`)}
      ${card('Stability', `<div class="stat"><div class="k">Stability (30 days)</div><div class="v" style="color:${bad ? 'var(--warn)' : 'var(--ok)'}">${h.bluescreens30d ? h.bluescreens30d + ' ' + TXT.bsodShort : h.unexpectedShutdowns30d ? h.unexpectedShutdowns30d + ' issue' + (h.unexpectedShutdowns30d > 1 ? 's' : '') : 'Stable'}</div><div class="s">${h.unexpectedShutdowns30d} ${TXT.crash} · ${h.bluescreens30d} ${TXT.bsod} · up ${h.uptimeHours}h</div></div>`)}
    </div>
    <h2>Drives</h2><div class="grid g3">${disks.map(d => { const good = d.health === 'Healthy'; const unk = !d.health || d.health === 'Unknown'; return card(d.name, `
      <div class="row"><div class="n" style="font-weight:600">${esc(d.name)}</div><div class="spacer"></div>${tag(d.health || 'unknown', good ? 'ok' : unk ? 'dim' : 'bad')}</div>
      <div class="m" style="margin:4px 0 12px">${esc(d.media)} · ${esc(d.bus)} · ${size(d.size)}</div>
      <div class="grid" style="grid-template-columns:1fr 1fr;gap:8px">
        <div><div class="m">Temperature</div><div class="mono">${d.temp ? d.temp + '°C' : '–'}</div></div>
        <div><div class="m">Wear used</div><div class="mono" style="color:${d.wear > 80 ? 'var(--bad)' : d.wear > 50 ? 'var(--warn)' : 'inherit'}">${d.wear != null ? d.wear + '%' : '–'}</div></div>
        <div><div class="m">Powered on</div><div class="mono">${d.hours != null ? Math.round(d.hours).toLocaleString() + ' h' : '–'}</div></div>
        <div><div class="m">Uncorrected errors</div><div class="mono" style="color:${(d.readErr || d.writeErr) ? 'var(--bad)' : 'inherit'}">${d.readErr != null ? (d.readErr || 0) + (d.writeErr || 0) : '–'}</div></div>
      </div>${good || unk ? '' : '<div class="note warn" style="margin-top:12px">Back up this drive now and plan to replace it.</div>'}${unk && d.hint ? `<div class="m" style="margin-top:10px">${esc(d.hint)}</div>` : ''}`); }).join('')}</div>
    ${h.battery ? `<h2>Battery</h2>${card('Battery', `<div class="row"><div><div class="big">${h.battery.health ?? '–'}%</div><div class="m">of original capacity · ${h.battery.charge}% charged now</div></div><div style="flex:1;max-width:340px"><div class="bar ${h.battery.health < 60 ? 'red' : h.battery.health < 80 ? 'hot' : ''}"><span style="width:${h.battery.health || 0}%"></span></div></div><div class="spacer"></div><button class="btn" onclick="sysAct('batteryreport',this)">Full battery report</button></div>`)}` : ''}
    <h2>System errors · last 7 days</h2>${card('System errors', h.errors7d ? `<div class="m" style="margin-bottom:10px">${h.errors7d} errors logged. Most frequent sources:</div>${top.map(t => `<div class="row" style="margin-bottom:6px"><span class="mono" style="width:54px;color:var(--warn)">${t.count}×</span>${esc(t.source)}</div>`).join('')}<div class="m" style="margin-top:10px">A few errors a day is normal. One source repeating hundreds of times usually points at a specific driver or device.</div>` : '<div style="color:var(--ok)">✓ No system errors logged.</div>')}`;
  } catch (e) { $('#hw').innerHTML = `<div class="note warn">${esc(e.message)}</div>`; }
};

async function refreshRam() {
  try { const d = await api('/api/mem'); const pct = (d.total - d.free) / d.total * 100; $('#hram').className = 'bar ' + (pct > 85 ? 'red' : pct > 70 ? 'hot' : ''); $('#hram span').style.width = pct + '%'; $('#hramt').textContent = Math.round(pct) + '% · ' + size(d.free) + ' free'; } catch {}
}

setTheme(saved);
setInterval(() => api('/api/ping').catch(() => {}), 20000);

refreshRam();
go('dash');
